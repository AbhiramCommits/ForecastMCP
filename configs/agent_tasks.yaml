# Agent-harness evaluation tasks. Ground truth comes from the frozen holdout:
# the oracle is the best single model's per-window WQL in the benchmark run.
tasks:
  - id: t01
    question: "What will demand for S001 look like over the next 4 weeks, with an 80% interval, using split 6?"
    dataset: synthetic_supply
    series_id: S001
    horizon: 28
    quantiles: [0.1, 0.5, 0.9]
    window_id: 6
    inject_failure: false
  - id: t02
    question: "Forecast S002 for the next 2 weeks with an 80% interval using split 6."
    dataset: synthetic_supply
    series_id: S002
    horizon: 14
    quantiles: [0.1, 0.5, 0.9]
    window_id: 6
    inject_failure: false
