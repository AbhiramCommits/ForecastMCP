# Full benchmark geometry. Frozen holdout boundaries live in configs/holdout.yaml.
run_id: benchmark
seed: 42
n_resamples: 1000
n_windows: 6
quantiles: [0.05, 0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9, 0.95]
datasets:
  synthetic_supply:
    max_series: 50
    models: [seasonal_naive, autoets, autotheta, seasonal_naive_cov, chronos, chronos-lora-v1]
    ensembles: [ensemble_vincentization, ensemble_best_on_backtest, ensemble_inverse_error]
  m4_daily:
    max_series: 23
    models: [seasonal_naive, autoets, autotheta, chronos]
    ensembles: [ensemble_vincentization, ensemble_best_on_backtest, ensemble_inverse_error]
