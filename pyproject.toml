[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastmcp"
version = "0.1.0"
description = "MCP server and agent harness for pretrained time-series foundation models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "ForecastMCP contributors"}]
keywords = ["forecasting", "mcp", "timeseries", "chronos", "agents"]
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "peft>=0.10",
  "accelerate>=0.30",
  "pydantic>=2.5",
  "mcp>=1.2",
  "gluonts>=0.14",
  "statsforecast>=1.7",
  "duckdb>=0.10",
  "pandas>=2.0",
  "numpy>=1.26,<2",
  "matplotlib>=3.8",
  "opentelemetry-sdk>=1.24",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
fm = [
  "chronos-forecasting>=1.4",
  "timesfm>=1.0",
  "uni2ts>=1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "huggingface_hub>=0.23",
]

[project.scripts]
forecastmcp = "forecastmcp.cli:main"

[tool.setuptools.packages.find]
include = ["forecastmcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "artifacts", "results", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["forecastmcp"]
omit = ["forecastmcp/mcp/server.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
