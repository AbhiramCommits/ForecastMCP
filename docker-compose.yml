services:
  forecastmcp:
    build: .
    image: forecastmcp:latest
    ports:
      - "8000:8000"
    environment:
      FORECASTMCP_HOME: /app
      FORECASTMCP_OFFLINE: "1"
      FORECASTMCP_SEED: "42"
    command:
      - serve
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - forecastmcp-data:/app/data
      - forecastmcp-artifacts:/app/artifacts
      - forecastmcp-results:/app/results
    restart: unless-stopped

volumes:
  forecastmcp-data:
  forecastmcp-artifacts:
  forecastmcp-results:
